services:
  - type: web
    name: jobtrackr-backend
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install --include=dev && npm run build && npm run migrate:up
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrackr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Set these in the Render dashboard (sync: false = not stored in this file)
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL # https://<backend>.onrender.com/api/auth/google/callback
        sync: false
      - key: BACKEND_URL # https://<backend>.onrender.com
        sync: false
      - key: FRONTEND_URL # https://<your-app>.vercel.app
        sync: false

databases:
  - name: jobtrackr-db
    plan: free
    databaseName: job_trackr
    user: jobtrackr
